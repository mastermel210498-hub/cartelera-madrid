name: Actualizar cartelera

on:
  schedule:
    - cron: "17 5 * * *"    # 06:17 Madrid (invierno) / 07:17 (verano)
    - cron: "17 13 * * *"   # repaso a mediodía (cambios de última hora)
  workflow_dispatch:
    inputs:
      cadenas:
        description: "Cadenas (vacío = todas). Ej: odeon,mk2"
        required: false
        default: ""
      dias:
        description: "Días a futuro"
        required: false
        default: "7"
  push:
    branches: [main]
    paths: ["src/**", "pyproject.toml", ".github/workflows/cartelera.yml"]

permissions:
  contents: write

concurrency:
  group: cartelera
  cancel-in-progress: false

jobs:
  tests:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with: { python-version: "3.12", cache: pip }
      - run: pip install -e ".[dev]"
      - run: pytest -q

  scrape:
    needs: tests
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with: { python-version: "3.12", cache: pip }

      - name: Instalar
        run: |
          pip install -e ".[browser]"
          python -m playwright install --with-deps chromium

      - name: Comprobar instalación
        run: |
          python --version
          python -c "import cartelera, httpx, playwright, bs4, lxml, pydantic; print('imports OK', cartelera.__version__)"

      - name: Scrapear
        env:
          TZ: Europe/Madrid
          PYTHONUNBUFFERED: "1"
          # Settings → Secrets and variables → Actions → Variables
          SITIO_DOMINIO: ${{ vars.SITIO_DOMINIO || 'carteleramadrid.es' }}
          ADSENSE_CLIENT: ${{ vars.ADSENSE_CLIENT }}
          SITIO_TITULAR: ${{ vars.SITIO_TITULAR }}
          SITIO_CONTACTO: ${{ vars.SITIO_CONTACTO }}
        run: |
          set -o pipefail
          CADENAS="${{ github.event.inputs.cadenas }}"
          python -m cartelera \
            ${CADENAS:+-c "$CADENAS"} \
            -d "${{ github.event.inputs.dias || '7' }}" \
            -o docs/data \
            --debug-html debug/ \
            --check 2>&1 | tee scrape.log || echo "ALGUNA_CADENA_FALLO=1" >> "$GITHUB_ENV"

      # Resumen visible en la página pública del run (sin iniciar sesión)
      - name: Resumen
        if: always()
        run: |
          {
            echo "## Cartelera — resultado"
            if [ -f docs/data/index.json ]; then
              echo '```json'
              python -c "import json;print(json.dumps(json.load(open('docs/data/index.json'))['estado'],ensure_ascii=False,indent=1))"
              echo '```'
            fi
            echo "### Últimas líneas del log"
            echo '```'
            tail -n 80 scrape.log 2>/dev/null || echo "(sin log)"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
          # También como anotaciones (se ven en la cabecera del run)
          grep -E "Traceback|Error|falló|WARNING" scrape.log 2>/dev/null | tail -n 15 | while IFS= read -r l; do
            echo "::warning::${l:0:300}"
          done || true

      # El HTML descargado se guarda 7 días: si una cadena falla, bájatelo desde la
      # página del run y úsalo como fixture para arreglar el parser.
      - name: Guardar HTML de depuración
        if: always()
        uses: actions/upload-artifact@v5
        with:
          name: debug-html
          path: debug/
          retention-days: 7
          if-no-files-found: ignore

      - name: Commit de los datos
        run: |
          git config user.name  "cartelera-bot"
          git config user.email "cartelera-bot@users.noreply.github.com"
          git add docs
          if git diff --cached --quiet; then
            echo "Sin cambios en los datos"
          else
            git commit -m "datos: cartelera $(date +'%F %H:%M')"
            git pull --rebase --autostash
            git push
          fi

      # Marca el run en rojo (→ email de GitHub) si alguna cadena devolvió 0 sesiones,
      # pero DESPUÉS de publicar lo que sí funcionó.
      - name: Avisar si alguna cadena falló
        if: env.ALGUNA_CADENA_FALLO == '1'
        run: |
          echo "::error::Alguna cadena devolvió 0 sesiones. Mira el log y el artefacto debug-html."
          exit 1
